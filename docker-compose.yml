services:
  backend:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    container_name: jacaranda-backend
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DB_PATH=/app/data/jacaranda.db
    volumes:
      # Persistencia de la base de datos SQLite en el host
      - ./src/backend/data:/app/data

  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
    container_name: jacaranda-frontend
    ports:
      - "5173:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true
    volumes:
      # Sincroniza cambios locales en tiempo real
      - ./src/frontend:/app
      - /app/node_modules
    depends_on:
      - backend


networks:
  default:
    name: jacaranda-network
