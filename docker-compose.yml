services:
  backend:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
      target: production
    container_name: jacaranda-backend
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DB_PATH=/app/data/jacaranda.db
    volumes:
      # Persistencia de la base de datos SQLite en el host
      - ./src/backend/data:/app/data

  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
      target: development
    container_name: jacaranda-frontend
    ports:
      - "5173:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true
    volumes:
      # Sincroniza cambios locales en tiempo real
      - ./src/frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  # ===========================================================================
  # PERFIL DE TESTS (Solo se corre cuando explícitamente se pide --profile test)
  # No arranca con 'docker compose up', no ocupa puertos y se autodestruye al terminar.
  # ===========================================================================
  backend-test:
    profiles: ["test"]
    build:
      context: ./src/backend
      dockerfile: Dockerfile
      target: test
    container_name: jacaranda-backend-test

  frontend-test:
    profiles: ["test"]
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
      target: test
    container_name: jacaranda-frontend-test


