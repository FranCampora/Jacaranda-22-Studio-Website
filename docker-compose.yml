  backend:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    container_name: jacaranda-backend
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DB_PATH=/app/data/jacaranda.db
    volumes:
      # Persistencia de la base de datos SQLite en el host
      - ./src/backend/data:/app/data

networks:
  default:
    name: jacaranda-network
