openapi: 3.0.3

info:
  title: API Jacaranda 22 Studio
  description: >
    API para estudio de grabación Jacaranda 22 Studio
  version: 1.0.0

servers:
  - url: http://localhost:3000/api/v1
    description: Servidor local (v1)

tags:
  - name: Proyectos
    description: CRUD de proyectos y asignación de integrantes
  - name: Integrantes
    description: CRUD de integrantes del estudio
  - name: Reportes
    description: Reportes derivados de los proyectos
  - name: Sistema
    description: Chequeo de estado del servidor

paths:
  /proyectos:

    get:
      tags: [Proyectos]
      summary: Listar proyectos
      description: Devuelve todos los proyectos, del más nuevo al más viejo (por id).
      responses:
        '200':
          description: Lista de proyectos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Proyecto'

    post:
      tags: [Proyectos]
      summary: Crear un proyecto
      description: >
        Crea un proyecto. Todos los campos son obligatorios excepto fecha_fin_estimada, fecha_fin, genero y descripcion.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProyectoInput'
      responses:
        '201':
          description: Proyecto creado
          headers:
            Location:
              description: URL del proyecto creado
              schema:
                type: string
                example: /api/v1/proyectos/7
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Proyecto'
        '400':
          $ref: '#/components/responses/DatosInvalidos'

  /proyectos/{id}:

    parameters:
      - $ref: '#/components/parameters/ProyectoId'

    get:
      tags: [Proyectos]
      summary: Obtener un proyecto
      description: Devuelve el proyecto junto con los integrantes asignados.
      responses:
        '200':
          description: Proyecto con sus integrantes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProyectoDetalle'
        '404':
          $ref: '#/components/responses/ProyectoNoEncontrado'

    put:
      tags: [Proyectos]
      summary: Modificar un proyecto
      description: >
        Actualiza un proyecto
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProyectoUpdate'
      responses:
        '200':
          description: Proyecto actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Proyecto'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '404':
          $ref: '#/components/responses/ProyectoNoEncontrado'

    delete:
      tags: [Proyectos]
      summary: Eliminar un proyecto
      description: >
        Elimina el proyecto Y TODOS LOS INTEGRANTES ASIGNADOS
      responses:
        '204':
          description: Proyecto eliminado
        '404':
          $ref: '#/components/responses/ProyectoNoEncontrado'

  # PROYECTOS relacion Many to many a INTEGRANTES

  /proyectos/{id}/integrantes:

    parameters:
      - $ref: '#/components/parameters/ProyectoId'

    get:
      tags: [Proyectos]
      summary: Listar los integrantes de un proyecto
      description: Devuelve los integrantes asignados, ordenados por nombre
      responses:
        '200':
          description: Integrantes del proyecto
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IntegranteEnProyecto'
        '404':
          $ref: '#/components/responses/ProyectoNoEncontrado'

    post:
      tags: [Proyectos]
      summary: Asignar un integrante a un proyecto
      description: >
        Vincula un integrante existente con el proyecto. Si ya estaba
        asignado, se reemplaza su rol_en_proyecto.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [integrante_id]
              properties:
                integrante_id:
                  type: integer
                  example: 2
                rol_en_proyecto:
                  type: string
                  nullable: true
                  example: Productor musical
      responses:
        '200':
          description: Integrante vinculado
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: OK
                  mensaje:
                    type: string
                    example: Integrante vinculado exitosamente al proyecto
        '400':
          description: Falta el campo integrante_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No existe el proyecto o el integrante
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /proyectos/{id}/integrantes/{integranteId}:

    parameters:
      - $ref: '#/components/parameters/ProyectoId'
      - name: integranteId
        in: path
        required: true
        description: ID del integrante
        schema:
          type: integer

    delete:
      tags: [Proyectos]
      summary: Desvincular un integrante de un proyecto
      description: Saca al integrante del proyecto. No borra al integrante.
      responses:
        '204':
          description: Integrante desvinculado
        '404':
          description: No existe el proyecto, o el integrante no estaba asignado a él
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /integrantes:

    get:
      tags: [Integrantes]
      summary: Listar integrantes
      description: Devuelve todos los integrantes, del más nuevo al más viejo (por id).
      responses:
        '200':
          description: Lista de integrantes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Integrante'

    post:
      tags: [Integrantes]
      summary: Crear un integrante
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntegranteInput'
      responses:
        '201':
          description: Integrante creado
          headers:
            Location:
              description: URL del integrante creado
              schema:
                type: string
                example: /api/v1/integrantes/6
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Integrante'
        '400':
          $ref: '#/components/responses/DatosInvalidos'

  /integrantes/{id}:

    parameters:
      - $ref: '#/components/parameters/IntegranteId'

    get:
      tags: [Integrantes]
      summary: Obtener un integrante
      description: Devuelve el integrante junto con los proyectos en los que participa.
      responses:
        '200':
          description: Integrante con sus proyectos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegranteDetalle'
        '404':
          $ref: '#/components/responses/IntegranteNoEncontrado'

    put:
      tags: [Integrantes]
      summary: Modificar un integrante
      description: >
        Se modifica un integrante
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntegranteUpdate'
      responses:
        '200':
          description: Integrante actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Integrante'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '404':
          $ref: '#/components/responses/IntegranteNoEncontrado'

    delete:
      tags: [Integrantes]
      summary: Eliminar un integrante
      description: También se borran sus asignaciones a proyectos.
      responses:
        '204':
          description: Integrante eliminado
        '404':
          $ref: '#/components/responses/IntegranteNoEncontrado'

  /reportes:

    get:
      tags: [Reportes]
      summary: Obtener un reporte
      description: >
        Devuelve un reporte  sobre los proyectos. El formato de la
        respuesta depende del parámetro tipo
      parameters:
        - name: tipo
          in: query
          required: false
          schema:
            type: string
            enum: [general, estado, genero, financiero]
            default: general
      responses:
        '200':
          description: Reporte generado
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ReporteGeneral'
                  - $ref: '#/components/schemas/ReporteEstado'
                  - $ref: '#/components/schemas/ReporteGenero'
                  - $ref: '#/components/schemas/ReporteFinanciero'
        '400':
          description: El valor de tipo no es válido
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: Error
                  error:
                    type: string
                  tiposValidos:
                    type: array
                    items:
                      type: string
                    example: [estado, genero, financiero, general]

  /health:

    get:
      tags: [Sistema]
      summary: Estado del servidor
      description: >
        Se sirve en la raíz del servidor, no bajo /api/v1
        (http://localhost:3000/health).
      servers:
        - url: http://localhost:3000
      responses:
        '200':
          description: El servidor está funcionando
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: OK
                  message:
                    type: string
                    example: Servidor backend en funcionamiento
                  timestamp:
                    type: string
                    format: date-time

components:

  parameters:
    ProyectoId:
      name: id
      in: path
      required: true
      description: ID del proyecto
      schema:
        type: integer
    IntegranteId:
      name: id
      in: path
      required: true
      description: ID del integrante
      schema:
        type: integer

  responses:
    DatosInvalidos:
      description: Datos de entrada inválidos o JSON mal formado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ProyectoNoEncontrado:
      description: Proyecto no encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    IntegranteNoEncontrado:
      description: Integrante no encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:

    Error:
      type: object
      properties:
        status:
          type: string
          example: Error
        error:
          type: string
          example: Datos de entrada inválidos
        detalles:
          type: array
          description: Lista de errores de validación (solo en los 400 de validación)
          items:
            type: string
          example:
            - El campo "nombre" es obligatorio y debe ser una cadena no vacía.



    Proyecto:
      type: object
      properties:
        id:
          type: integer
          example: 1
        nombre:
          type: string
          example: Proyecto 1
        tipo:
          type: string
          description: Texto libre (single, disco, EP, beat, etc.)
          example: single
        estado:
          type: string
          description: Texto libre (nuevo, maqueta, grabacion, mezcla, listo, etc.)
          example: grabacion
        fecha_inicio:
          type: string
          format: date
          example: '2026-01-05'
        fecha_fin_estimada:
          type: string
          format: date
          nullable: true
        fecha_fin:
          type: string
          format: date
          nullable: true
        genero:
          type: string
          nullable: true
          example: Rap
        descripcion:
          type: string
          nullable: true
        precio_por_hora:
          type: number
          example: 2500
        cantidad_horas:
          type: number
          example: 10

    ProyectoInput:
      type: object
      required: [nombre, tipo, estado, fecha_inicio]
      properties:
        nombre:
          type: string
        tipo:
          type: string
        estado:
          type: string
        fecha_inicio:
          type: string
          format: date
          description: Formato YYYY-MM-DD
        fecha_fin_estimada:
          type: string
          format: date
          nullable: true
        fecha_fin:
          type: string
          format: date
          nullable: true
          description: No puede ser anterior a fecha_inicio
        genero:
          type: string
          nullable: true
        descripcion:
          type: string
          nullable: true
        precio_por_hora:
          type: number
          minimum: 0
          default: 0
        cantidad_horas:
          type: number
          minimum: 0
          default: 0

    ProyectoUpdate:
      type: object
      description: Mismos campos que ProyectoInput pero todos opcionales.
      properties:
        nombre:
          type: string
        tipo:
          type: string
        estado:
          type: string
        fecha_inicio:
          type: string
          format: date
        fecha_fin_estimada:
          type: string
          format: date
          nullable: true
        fecha_fin:
          type: string
          format: date
          nullable: true
        genero:
          type: string
          nullable: true
        descripcion:
          type: string
          nullable: true
        precio_por_hora:
          type: number
          minimum: 0
        cantidad_horas:
          type: number
          minimum: 0

    ProyectoDetalle:
      allOf:
        - $ref: '#/components/schemas/Proyecto'
        - type: object
          properties:
            integrantes:
              type: array
              items:
                $ref: '#/components/schemas/IntegranteEnProyecto'
    Integrante:
      type: object
      properties:
        id:
          type: integer
          example: 1
        nombre:
          type: string
          example: Lucas Rodríguez
        rol:
          type: string
          description: Texto libre (artista, productor, sesionista, etc.)
          example: artista
        email:
          type: string
          format: email
          nullable: true
        telefono:
          type: string
          nullable: true

    IntegranteInput:
      type: object
      required: [nombre, rol]
      properties:
        nombre:
          type: string
        rol:
          type: string
        email:
          type: string
          format: email
          nullable: true
        telefono:
          type: string
          nullable: true

    IntegranteUpdate:
      type: object
      description: Mismos campos que IntegranteInput pero todos opcionales.
      properties:
        nombre:
          type: string
        rol:
          type: string
        email:
          type: string
          format: email
          nullable: true
        telefono:
          type: string
          nullable: true

    IntegranteEnProyecto:
      description: Integrante tal como aparece dentro de un proyecto.
      allOf:
        - $ref: '#/components/schemas/Integrante'
        - type: object
          properties:
            rol_en_proyecto:
              type: string
              nullable: true
              example: Voz principal

    ProyectoDeIntegrante:
      description: Proyecto tal como aparece dentro de un integrante.
      allOf:
        - $ref: '#/components/schemas/Proyecto'
        - type: object
          properties:
            rol_en_proyecto:
              type: string
              nullable: true
              example: Voz principal

    IntegranteDetalle:
      allOf:
        - $ref: '#/components/schemas/Integrante'
        - type: object
          properties:
            proyectos:
              type: array
              items:
                $ref: '#/components/schemas/ProyectoDeIntegrante'

    #  Reportes 

    ConteoPorEstado:
      type: object
      properties:
        estado:
          type: string
          example: grabacion
        cantidad:
          type: integer
          example: 2

    ConteoPorGenero:
      type: object
      properties:
        genero:
          type: string
          description: Los proyectos sin género aparecen como "Sin género"
          example: Rap
        cantidad:
          type: integer
          example: 2

    ResumenFinanciero:
      type: object
      properties:
        total_proyectos:
          type: integer
        total_horas:
          type: number
        facturacion_estimada:
          type: number
          description: Suma de precio_por_hora * cantidad_horas de todos los proyectos
        promedio_precio_hora:
          type: number

    ReporteEstado:
      type: object
      properties:
        tipo:
          type: string
          example: estado
        titulo:
          type: string
        totalProyectos:
          type: integer
        datos:
          type: array
          items:
            $ref: '#/components/schemas/ConteoPorEstado'

    ReporteGenero:
      type: object
      properties:
        tipo:
          type: string
          example: genero
        titulo:
          type: string
        totalProyectos:
          type: integer
        datos:
          type: array
          items:
            $ref: '#/components/schemas/ConteoPorGenero'

    ReporteFinanciero:
      type: object
      properties:
        tipo:
          type: string
          example: financiero
        titulo:
          type: string
        datos:
          $ref: '#/components/schemas/ResumenFinanciero'

    ReporteGeneral:
      type: object
      properties:
        tipo:
          type: string
          example: general
        titulo:
          type: string
        fechaGeneracion:
          type: string
          format: date-time
        finanzas:
          $ref: '#/components/schemas/ResumenFinanciero'
        distribucionEstados:
          type: array
          items:
            $ref: '#/components/schemas/ConteoPorEstado'
        distribucionGeneros:
          type: array
          items:
            $ref: '#/components/schemas/ConteoPorGenero'